[project]
name = "ai-dashboard"
version = "2.0.0"
description = "Terminal UI for tracking cutting-edge AI developments (delta feed from arXiv, HN, GitHub Trending, HuggingFace, and AI newsletters)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "AI Dashboard Contributors" },
]
dependencies = [
    "textual>=8.2.3",
    "httpx>=0.27",
    "feedparser>=6.0.10",
    "selectolax>=0.3.20",
    "defusedxml>=0.7",
    "aiosqlite>=0.20",
    "trafilatura>=1.8",
    "litellm>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=1.0",
    "respx>=0.21",
    "freezegun>=1.5",
]

[project.scripts]
ai-dashboard = "ai_dashboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:feedparser",
]
